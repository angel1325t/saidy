<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Microservicios</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>
    <main class="page-wrap">
      <section class="hero">
        <p class="hero-kicker">Inicio</p>
        <h1>Cargando...</h1>
        <p>Redireccionando a la pantalla correcta.</p>
      </section>
    </main>

    <script src="/js/shared.js"></script>
    <script>
      window.BlogApp.renderNavbar();
      (async () => {
        const user = await window.BlogApp.verifySession();
        if (user) {
          window.location.replace('/posts.html');
        } else {
          window.location.replace('/login.html');
        }
      })();
    </script>
  </body>
</html>
