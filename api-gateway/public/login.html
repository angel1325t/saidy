<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Blog Microservicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>

    <main class="page-wrap">
      <section class="hero">
        <p class="hero-kicker">Acceso</p>
        <h1>Iniciar sesión</h1>
        <p>Entra con tu cuenta para leer, comentar y participar en el blog.</p>
      </section>

      <section class="panel">
        <form id="login-form" class="form-grid">
          <div>
            <label class="field-label" for="login-email">Correo</label>
            <input id="login-email" name="email" type="email" required class="input" placeholder="tu@correo.com" />
          </div>

          <div>
            <label class="field-label" for="login-password">Contraseña</label>
            <input id="login-password" name="password" type="password" required class="input" placeholder="••••••••" />
          </div>

          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <div id="form-message" class="hidden"></div>

        <div class="auth-footer muted">
          <span>¿No tienes cuenta?</span>
          <a href="/register.html" class="btn btn-ghost">Regístrate</a>
        </div>
      </section>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
