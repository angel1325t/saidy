<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Blog Microservicios</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>

    <main class="page-wrap auth-page">
      <div class="auth-layout auth-layout--poster">
        <section class="panel auth-card">
          <a class="back-link" href="/posts.html">&larr; Home</a>
          <h2>Iniciar sesión</h2>
          <p class="muted">Usa tu correo y contraseña para entrar.</p>

          <form id="login-form" class="form-grid">
            <div>
              <label class="field-label" for="login-email">Correo</label>
              <input id="login-email" name="email" type="email" required class="input" placeholder="tu@correo.com" autocomplete="email" />
            </div>

            <div>
              <label class="field-label" for="login-password">Contraseña</label>
              <input
                id="login-password"
                name="password"
                type="password"
                required
                class="input"
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>

            <button class="btn btn-primary" type="submit">Entrar</button>
          </form>

          <div id="form-message" class="hidden"></div>
        </section>

        <aside class="auth-aside auth-aside--splash">
          <div class="auth-splash">
            <p class="auth-splash__kicker">Blog Microservicios</p>
            <h2>Get started</h2>
            <p>¿No tienes una cuenta todavía?</p>
            <a href="/register.html" class="btn btn-invert">Crear cuenta</a>
          </div>
        </aside>
      </div>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
