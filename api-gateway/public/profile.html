<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil | Blog Microservicios</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>

    <main class="page-wrap">
      <section class="hero">
        <p class="hero-kicker">Cuenta</p>
        <h1>Mi perfil</h1>
        <p>Edita tu información personal y personaliza tu avatar.</p>
      </section>

      <section class="panel">
        <dl class="kv-grid">
          <div class="kv-item">
            <dt>Correo</dt>
            <dd id="profile-email">-</dd>
          </div>
          <div class="kv-item">
            <dt>Rol</dt>
            <dd id="profile-role">-</dd>
          </div>
        </dl>

        <div id="page-message" class="hidden"></div>

        <form id="profile-form" class="form-grid stack-top">
          <div>
            <label class="field-label" for="profile-name">Nombre</label>
            <input id="profile-name" name="name" type="text" class="input" />
          </div>
          <div>
            <label class="field-label" for="profile-bio">Bio</label>
            <textarea id="profile-bio" name="bio" rows="3" class="textarea"></textarea>
          </div>
          <div>
            <label class="field-label" for="profile-avatar">Avatar URL</label>
            <input id="profile-avatar" name="avatarUrl" type="url" class="input" placeholder="https://..." />
          </div>

          <button class="btn btn-primary" type="submit">Guardar cambios</button>
        </form>
      </section>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
