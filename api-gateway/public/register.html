<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Blog Microservicios</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>

    <main class="page-wrap auth-page">
      <div class="auth-layout auth-layout--poster">
        <section class="panel auth-card">
          <a class="back-link" href="/posts.html">&larr; Home</a>
          <h2>Crear cuenta</h2>
          <p class="muted">Completa tus datos para registrarte.</p>

          <div class="read-only-note">Nota: el rol no se elige aquí. Un administrador puede asignarte permisos después.</div>

          <form id="register-form" class="form-grid">
            <div>
              <label class="field-label" for="register-name">Nombre</label>
              <input id="register-name" name="name" type="text" required class="input" placeholder="Tu nombre" autocomplete="name" />
            </div>

            <div>
              <label class="field-label" for="register-email">Correo</label>
              <input id="register-email" name="email" type="email" required class="input" placeholder="tu@correo.com" autocomplete="email" />
            </div>

            <div>
              <label class="field-label" for="register-password">Contraseña</label>
              <input
                id="register-password"
                name="password"
                type="password"
                minlength="6"
                required
                class="input"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
              />
            </div>

            <button class="btn btn-primary" type="submit">Registrarme</button>
          </form>

          <div id="form-message" class="hidden"></div>
        </section>

        <aside class="auth-aside auth-aside--splash">
          <div class="auth-splash">
            <p class="auth-splash__kicker">Blog Microservicios</p>
            <h2>¡Bienvenido!</h2>
            <p>¿Ya tienes una cuenta?</p>
            <a href="/login.html" class="btn btn-invert">Iniciar sesión</a>
          </div>
        </aside>
      </div>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
