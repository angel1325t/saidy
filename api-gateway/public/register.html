<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Blog Microservicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <div id="nav-slot"></div>

    <main class="page-wrap">
      <section class="hero">
        <p class="hero-kicker">Registro</p>
        <h1>Crear cuenta</h1>
        <p>
          La cuenta se crea como <strong>Estudiante</strong>. Si es la primera cuenta del sistema, se creará como <strong>Administrador</strong>
          para inicializar el panel.
        </p>
      </section>

      <section class="panel">
        <form id="register-form" class="form-grid">
          <div>
            <label class="field-label" for="register-name">Nombre</label>
            <input id="register-name" name="name" type="text" required class="input" placeholder="Tu nombre" />
          </div>

          <div>
            <label class="field-label" for="register-email">Correo</label>
            <input id="register-email" name="email" type="email" required class="input" placeholder="tu@correo.com" />
          </div>

          <div>
            <label class="field-label" for="register-password">Contraseña</label>
            <input id="register-password" name="password" type="password" minlength="6" required class="input" placeholder="Mínimo 6 caracteres" />
          </div>

          <button class="btn btn-primary" type="submit">Registrarme</button>
        </form>

        <div id="form-message" class="hidden"></div>

        <div class="auth-footer muted">
          <span>¿Ya tienes cuenta?</span>
          <a href="/login.html" class="btn btn-ghost">Inicia sesión</a>
        </div>
      </section>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
